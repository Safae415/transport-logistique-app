version: "3.9"

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-logistique
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Transport_db
      MYSQL_USER: root
      MYSQL_PASSWORD: safae
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logistique-network

  backend:
    build:
      context: ./backend/transport-logistique-backend
    container_name: springboot-logistique
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/Transport_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: safae
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysql-db
    networks:
      - logistique-network

  frontend:
    build:
      context: ./frontend/transport-logistique-frontend
    container_name: react-logistique
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - logistique-network

volumes:
  mysql_data:

networks:
  logistique-network:
    driver: bridge
